<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUMP OS — Calendário</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/jump-ui.css?v=5">
<style>
.ed-ov{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);z-index:120;display:flex;align-items:center;justify-content:center;padding:16px}
.ed-card{background:var(--card,#141312);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:440px;max-height:92vh;overflow:auto;padding:20px;position:relative}
.ed-x{position:absolute;top:12px;right:12px;background:transparent;border:none;color:var(--t3);font-size:18px;cursor:pointer;line-height:1}
.ed-tema{font-family:var(--B,sans-serif);font-weight:800;font-size:17px;color:var(--t1);padding-right:24px}
.ed-meta{font-family:var(--M);font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin:4px 0 12px}
.ed-img{border-radius:10px;overflow:hidden;background:rgba(255,255,255,.03);min-height:60px;display:flex;align-items:center;justify-content:center}
.ed-img img{width:100%;display:block}
.ed-img .ph{font-family:var(--M);font-size:11px;color:var(--t3);padding:26px}
.ed-actsi{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0 4px}
.ed-cota{font-family:var(--M);font-size:9px;color:var(--t3);margin-top:6px}
.ed-lbl{display:block;font-family:var(--M);font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin:14px 0 5px}
.ed-ta,.ed-inp{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:9px;color:var(--t1);font-family:var(--B,sans-serif);font-size:13px;padding:9px 11px;box-sizing:border-box}
.ed-ta{resize:vertical;line-height:1.5}
.ed-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.cal-ev{cursor:pointer}
.cal-day{min-height:44px!important;padding:5px 4px!important;position:relative;cursor:pointer}
.cal-day.sel{outline:2px solid var(--g);outline-offset:-2px}
.cal-n{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:rgba(52,211,153,.18);color:var(--g);font-family:var(--M);font-size:9.5px;font-weight:700;margin-top:3px}
.cal-n.pend{background:rgba(251,191,36,.18);color:var(--yel,#fbbf24)}
.ck{display:inline-flex;align-items:center;gap:4px;font-family:var(--M);font-size:9px;letter-spacing:.6px;text-transform:uppercase;padding:2px 7px;border-radius:20px}
.ck-aguard{background:rgba(255,255,255,.06);color:var(--t3)}
.ck-prod{background:rgba(79,124,255,.15);color:#7c9cff}
.ck-aprov{background:rgba(251,191,36,.15);color:var(--yel,#fbbf24)}
.ck-ok{background:rgba(52,211,153,.15);color:var(--g)}
.ck-pub{background:rgba(139,92,246,.15);color:var(--lil,#C084FC)}
.ck-vid{background:rgba(248,113,113,.13);color:var(--red,#f87171)}
/* PUBLICAÇÃO MANUAL (Parte 2, 15/set/2026): "+" sempre visível (não só no hover) — em telas
   de toque não existe hover, e o pedido foi "cada dia tem um sinal de mais". */
.cal-add{position:absolute;top:2px;right:2px;width:15px;height:15px;line-height:14px;text-align:center;border-radius:50%;background:rgba(255,255,255,.07);color:var(--t3);font-size:11px;font-weight:700;cursor:pointer}
.cal-add:hover{background:rgba(52,211,153,.22);color:var(--g)}
.ev-del{background:transparent;border:none;color:var(--t3);font-size:14px;cursor:pointer;padding:4px 6px;line-height:1}
.ev-del:hover{color:#f87171}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>/*polimento-jump*/.cal-day{border-radius:12px;transition:.15s}.cal-day:hover{border-color:rgba(var(--g-rgb),.4)}.cal-ev{border-radius:6px}.ed-card{border-radius:16px}.hd-hello{color:var(--g)}</style>
</head>
<body>
<div class="grain"></div>
<div class="loading" id="loading"><div class="ld-spin"></div><div class="ld-t">Carregando calendário...</div></div>
<div class="app">
<main class="main">
  <div class="hd">
    <div><div class="hd-hello">Calendário</div><h1 class="hd-h">Plano de <em>postagens.</em></h1></div>
  </div>
  <div class="card">
    <div class="cal-head">
      <button class="btn btn-o btn-sm" onclick="mudaMes(-1)">←</button>
      <div class="cal-mes" id="cal-mes">—</div>
      <button class="btn btn-o btn-sm" onclick="mudaMes(1)">→</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
  <div class="sec-lbl">Conteúdos do dia <span id="dia-sel" style="color:var(--g)"></span></div>
  <div id="dia-lista" class="card"><div style="font-family:var(--M);font-size:12px;color:var(--t3)">Clique em um dia do calendário para ver os conteúdos.</div></div>
</main>
</div>
<div class="ed-ov" id="ed-modal" style="display:none">
  <div class="ed-card">
    <button class="ed-x" onclick="fecharEd()">✕</button>
    <div class="ed-tema" id="ed-tema">—</div>
    <div class="ed-meta" id="ed-meta"></div>
    <div id="ed-trava" style="display:none;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--t2);line-height:1.5;margin-bottom:11px"></div>
    <div class="ed-img" id="ed-img"></div>
    <div class="ed-actsi" id="ed-actsi"></div>
    <label class="ed-lbl">Copy / legenda</label>
    <textarea class="ed-ta" id="ed-copy" rows="5"></textarea>
    <label class="ed-lbl">Data de publicação</label>
    <input class="ed-inp" id="ed-data" type="date">
    <div class="ed-foot">
      <button class="btn btn-o btn-sm" onclick="fecharEd()">Cancelar</button>
      <button class="btn btn-g btn-sm" id="ed-salvar" onclick="salvarConteudo()">Salvar alterações</button>
    </div>
  </div>
</div>

<!-- PUBLICAÇÃO MANUAL (Parte 2, 15/set/2026): criação do zero, "+" em cada dia do calendário.
     Reaproveita a infra de material do usuário da Etapa 2 (ver JS abaixo) — o arquivo pode ser
     enviado agora ou depois em Aprovações, usando o MESMO modal de upload que já existe lá. -->
<div class="ed-ov" id="criar-modal" style="display:none">
  <div class="ed-card">
    <button class="ed-x" onclick="fecharCriacao()">✕</button>
    <div class="ed-tema">Nova publicação</div>
    <div class="ed-meta" id="criar-data-lbl"></div>
    <label class="ed-lbl">Formato</label>
    <select class="ed-inp" id="criar-formato" onchange="atualizarCampoCopyCriacao()">
      <option value="feed">Feed (imagem)</option>
      <option value="story">Story</option>
      <option value="reels">Reels (vídeo)</option>
    </select>
    <label class="ed-lbl">Horário</label>
    <input class="ed-inp" id="criar-hora" type="time" value="09:00">
    <label class="ed-lbl">Título (opcional)</label>
    <input class="ed-inp" id="criar-tema" type="text" placeholder="Ex.: Promoção de sexta">
    <!-- STORY NÃO TEM LEGENDA (item 3, 15/set/2026): regra de plataforma, não preferência — some
         pra este formato (ver atualizarCampoCopyCriacao). -->
    <div id="criar-copy-wrap">
      <label class="ed-lbl">Copy / legenda (opcional)</label>
      <textarea class="ed-ta" id="criar-copy" rows="4" placeholder="Deixe em branco se quiser publicar só a arte, sem legenda."></textarea>
    </div>
    <div id="criar-copy-aviso-story" style="display:none;font-family:var(--M);font-size:11px;color:var(--t3);margin:14px 0 5px">📵 Stories não têm legenda no Instagram — o texto, se houver, vai na própria arte.</div>
    <!-- CARROSSEL POR UPLOAD (25/set/2026, "Carrossel por upload no calendário...", decisão 1,
         autorizado pelo João): 1 arquivo continua o comportamento de sempre (midia_url, peça
         única). 2+ arquivos passam a virar carrossel — é o publicador (api/cron.js) já pronto pra
         isso, só faltava a ponta da frente. `multiple` some quando o formato é story (só um
         arquivo, ver atualizarCampoCopyCriacao) — Instagram Stories não aceitam carrossel. -->
    <label class="ed-lbl" id="criar-arquivo-lbl">Arquivo (opcional agora — pode enviar depois em Aprovações). 2 a 10 imagens viram um carrossel.</label>
    <input class="ed-inp" id="criar-arquivo" type="file" accept="image/*,video/*" multiple>
    <div class="ed-foot">
      <button class="btn btn-o btn-sm" onclick="fecharCriacao()">Cancelar</button>
      <button class="btn btn-g btn-sm" id="criar-salvar" onclick="criarPublicacaoManual()">Criar publicação</button>
    </div>
  </div>
</div>

<script src="assets/jump-core.js?v=7"></script>
<script src="assets/classificacao.js?v=7"></script>
<script src="assets/jump-guia.js"></script>
<script>
let CTX=null,EVENTOS=[],ANO,MES,DIA_SEL=null;
// CHECK-IN: estágio real de cada publicação (ajuda o Agente de Publicação e o usuário)
function checkin(e){
  const f=String(e.formato||'').toLowerCase();
  const ehVideo=f.indexOf('reel')>=0||f.indexOf('video')>=0||f.indexOf('vídeo')>=0;
  if(e.status==='publicado')return['ck-pub','publicado'];
  if(e.status==='aprovado')return['ck-ok','pronto p/ publicar'];
  if(e.status==='aguardando_aprovacao')return['ck-aprov','aguardando sua aprovação'];
  if(e.status==='rejeitado')return['ck-aguard','recusado'];
  if(!e.midia_url&&ehVideo)return['ck-vid','envie seu vídeo'];
  if(!e.midia_url&&LOTE_ATIVO)return['ck-prod','em produção — aguarde'];
  return['ck-aguard','aguardando produção'];
}
let LOTE_ATIVO=false;
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
(async()=>{
  try{
    JUMP.sidebar('calendario');
    CTX=await JUMP.guard();
    JUMP.setUser(CTX.viewCliente||CTX.cliente,CTX.user);
    const hoje=new Date();ANO=hoje.getFullYear();MES=hoje.getMonth();
    try{
      const{data}=await JUMP.sb.from('conteudos').select('*').eq('user_id',CTX.viewId||CTX.user.id);
      // 'proposto' = plano ainda não aprovado em Tarefas → não aparece no calendário
      // 'excluido' (Etapa 1 — descarte real, 25/ago/2026) = descartado de vez → também não
      // aparece. Antes esse status nem existia sendo checado aqui: um post já excluído pelo
      // botão "🗑 EXCLUIR CONTEÚDO" (aprovar.html) continuava aparecendo no calendário — bug
      // pré-existente, independente desta correção, fechado de brinde agora.
      EVENTOS=(data||[]).filter(e=>e.status!=='proposto'&&e.status!=='excluido');
      try{
        const{data:od}=await JUMP.sb.from('ordens_servico').select('id').eq('user_id',CTX.viewId||CTX.user.id).eq('para_agente','criativo').eq('tarefa','criar_post').in('status',['pendente','processando']).limit(1);
        LOTE_ATIVO=!!(od&&od.length);
      }catch(e){}
    }catch(e){}
    render();
    document.getElementById('loading').classList.add('hide');
  }catch(e){}
})();
function evDoDia(d){
  return EVENTOS.filter(ev=>{
    const dt=ev.data_agendada||ev.data_sugerida||ev.created_at;
    if(!dt)return false;
    const e=new Date(dt);
    return e.getFullYear()===ANO&&e.getMonth()===MES&&e.getDate()===d;
  });
}
function render(){
  document.getElementById('cal-mes').textContent=MESES[MES]+' '+ANO;
  const prim=new Date(ANO,MES,1).getDay();
  const dias=new Date(ANO,MES+1,0).getDate();
  const hoje=new Date();
  let h=['D','S','T','Q','Q','S','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<prim;i++)h+='<div class="cal-day fora"></div>';
  for(let d=1;d<=dias;d++){
    const evs=evDoDia(d);
    const isHoje=hoje.getFullYear()===ANO&&hoje.getMonth()===MES&&hoje.getDate()===d;
    const pend=evs.filter(e=>e.status==='aguardando_aprovacao').length;
    h+=`<div class="cal-day${isHoje?' hoje':''}${evs.length?' tem':''}${DIA_SEL===d?' sel':''}" onclick="verDia(${d})"><span class="cal-add" title="Criar publicação" onclick="event.stopPropagation();abrirCriacao(${d})">+</span>${d}${evs.length?`<span class="cal-n${pend?' pend':''}">${evs.length}</span>`:''}</div>`;
  }
  document.getElementById('cal-grid').innerHTML=h;
}
function verDia(d){
  DIA_SEL=d;render();
  document.getElementById('dia-sel').textContent=d+' de '+MESES[MES];
  const evs=evDoDia(d);
  const w=document.getElementById('dia-lista');
  if(!evs.length){w.innerHTML='<div style="font-family:var(--M);font-size:12px;color:var(--t3)">Nenhum conteúdo neste dia. Peça ao Agente de Estratégia para preencher seu calendário.</div>';return}
  // FONTE ÚNICA DE EDIÇÃO: editar em dois lugares é como nascem divergências silenciosas.
  // O calendário passa a ser VISUALIZAÇÃO — o clique leva ao Aprovar com o card já aberto.
  w.innerHTML=evs.map(e=>{
    const t=JUMP.tipoPeca(e);
    // EXCLUIR NO CALENDÁRIO (Parte 2, 15/set/2026): mesma trava de editarConteudo — aprovado/
    // publicado não sai daqui (já está na fila do Agente de Publicação ou já foi ao ar).
    const podeExcluir=(e.status!=='aprovado'&&e.status!=='publicado');
    return `<div style="display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer" onclick="abrirNoAprovar('${e.id}')">
    <span style="font-size:17px">${t.ico}</span>
    <div style="flex:1"><strong style="font-size:14px">${JUMP.esc(e.tema||'Conteúdo')}</strong><div style="font-family:var(--M);font-size:10px;color:var(--t3);margin-top:3px">${JUMP.esc(t.label)} · <span class="ck ${checkin(e)[0]}">${checkin(e)[1]}</span> · <span style="color:var(--g)">abrir ✎</span></div></div>
    ${e.status==='aguardando_aprovacao'?'<span class="btn btn-g btn-sm">Aprovar →</span>':''}
    ${podeExcluir?`<button class="ev-del" title="Excluir" onclick="event.stopPropagation();excluirDoCalendario('${e.id}')">🗑</button>`:''}
  </div>`}).join('');
}
// C3: leva ao Aprovar com o card aberto. Mantém o ?ver= (modo supervisor) para não
// derrubar quem está vendo a conta de outro cliente.
function abrirNoAprovar(id){
  const ver=new URLSearchParams(location.search).get('ver');
  location.href='aprovar.html?id='+encodeURIComponent(id)+(ver?('&ver='+encodeURIComponent(ver)):'');
}
let EDIT=null,PREVIEW=null;
function toast(m,t){ if(window.JUMP&&JUMP.toast)JUMP.toast(m,t); else alert(m); }
function fmtDataInput(iso){ if(!iso)return''; try{const d=new Date(iso);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}catch(e){return''} }
// FILA TÉCNICA — item 6 (15/set/2026): editarConteudo() (abria o modal ed-modal) foi removida —
// zero chamadores em todo o repo (confirmado por grep) e nenhum outro ponto de calendario.html a
// invocava; o calendário virou visualização (clique leva a aprovar.html, ver abrirNoAprovar acima)
// desde que a edição passou a ser feita só em Aprovar. renderImgAtual/fecharEd/promptDoConteudo/
// renderPreviewCal/aceitarCal/recusarCal/abrirVariacao (abaixo) só eram alcançados a partir desta
// função ou de salvarConteudo/regerarImg (também removidas nesta rodada) — ficam órfãos do mesmo
// jeito, mas fora do escopo pedido (só estas três foram nomeadas); reportado à parte, não removido
// aqui. O marcador #ed-modal em si (HTML) também não tem mais nenhum caminho que o abra.
function renderImgAtual(){
  document.getElementById('ed-img').innerHTML=EDIT.midia_url?`<img src="${EDIT.midia_url}" alt="">`:'<div class="ph">Sem arte ainda</div>';
  document.getElementById('ed-actsi').innerHTML='<button class="btn btn-o btn-sm" onclick="regerarImg(this)">🎨 '+(EDIT.midia_url?'Regerar imagem':'Gerar imagem')+' (gasta 1 token)</button>';
}
function fecharEd(){ document.getElementById('ed-modal').style.display='none'; EDIT=null;PREVIEW=null; }
function promptDoConteudo(c){
  const meta=c.meta||{};
  return `Instagram ${c.formato||'feed'} post. Headline: "${meta.headline||c.tema}". `+
    `Support copy: "${(c.copy||'').slice(0,80)}". ${meta.oferta?('Offer badge: "'+meta.oferta+'". '):''}`+
    `Follow the brand visual identity (colors, fonts, style). Agency-grade, layered depth, top label, dominant headline, generous negative space. Portuguese text 100% correct.`;
}
function renderPreviewCal(d){
  document.getElementById('ed-img').innerHTML=`<img src="${d.url}" alt="">`;
  const rest=d.limite?('Imagens restantes: '+Math.max(0,(d.limite||0)-(d.usadas||0))):('Imagens usadas: '+(d.usadas||0));
  document.getElementById('ed-actsi').innerHTML=
    '<button class="btn btn-g btn-sm" onclick="aceitarCal()">✓ Usar esta</button>'+
    '<button class="btn btn-o btn-sm" onclick="abrirVariacao()">🔄 Regerar</button>'+
    '<button class="btn btn-o btn-sm" onclick="recusarCal()">✕ Descartar</button>'+
    '<div class="ed-cota">'+rest+'</div>';
}
async function aceitarCal(){
  if(!PREVIEW||!EDIT)return;
  try{
    const r=await fetch('/api/gerar-imagem',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(await JUMP.freshToken()||CTX.token)},
      body:JSON.stringify({acao:'registrar',url:PREVIEW.url,path:PREVIEW.path||null,nome:EDIT.tema||'Arte IA',conteudo_id:EDIT.id,ver_id:CTX.viewId||null})
    });
    const j=await r.json();
    if(!r.ok||!j.ok)throw new Error(j.error||'Falha ao salvar');
    EDIT.midia_url=PREVIEW.url; PREVIEW=null;
    const ev=EVENTOS.find(e=>String(e.id)===String(EDIT.id)); if(ev)ev.midia_url=EDIT.midia_url;
    toast('✓ Nova arte salva no conteúdo!');
    renderImgAtual();
  }catch(e){ toast(e.message||'Erro ao salvar','err'); }
}
function recusarCal(){ PREVIEW=null; renderImgAtual(); }
// RECRIAR COM DIREÇÃO: sem dizer o quanto mudar, a IA repete quase a mesma arte.
function abrirVariacao(){
  document.getElementById('ed-actsi').innerHTML=
    '<div style="width:100%"><div style="font-family:var(--M);font-size:9.5px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">O quanto mudar?</div>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">'+
      '<button class="btn btn-o btn-sm" onclick="regerarImg(this,25)">Leve · 25%<br><span style="font-size:8.5px;opacity:.7">mesma ideia, outra execução</span></button>'+
      '<button class="btn btn-o btn-sm" onclick="regerarImg(this,50)">Média · 50%<br><span style="font-size:8.5px;opacity:.7">outra composição</span></button>'+
      '<button class="btn btn-o btn-sm" onclick="regerarImg(this,100)">Radical · 100%<br><span style="font-size:8.5px;opacity:.7">conceito novo</span></button>'+
    '</div>'+
    '<input class="ed-inp" id="ed-ajuste" placeholder="O que mudar? (opcional: mais escuro, sem foto, foco no produto…)">'+
    '<button class="btn btn-o btn-sm" style="margin-top:7px" onclick="renderPreviewCal(PREVIEW)">← Voltar</button></div>';
}
function mudaMes(n){MES+=n;if(MES<0){MES=11;ANO--}if(MES>11){MES=0;ANO++}render()}

// ═══ PUBLICAÇÃO MANUAL (Parte 2, 15/set/2026; carrossel por upload, 25/set/2026, "Carrossel por
// upload no calendário, e alerta de defeito com linguagem de produto", autorizado pelo João) —
// usuário cria uma publicação do zero, como no planner do Meta. Reaproveita 100% a infra de
// material do usuário da Etapa 2 (mesmo status 'aguardando_material', mesmo bucket/caminho de
// Storage, mesmo bloqueio de aprovação até o arquivo existir — ver aprovar.html
// abrirMaterial/enviarMaterial, NUNCA tocado por esta rodada) — nenhum mecanismo novo de Storage
// criado. Formatos oferecidos: feed, story, reels. Carrossel NÃO é uma opção nova no menu — o
// sistema entende que é carrossel porque o usuário subiu mais de um arquivo (decisão explícita
// do João): 1 arquivo é peça única, como sempre; 2 a 10 imagens (nunca vídeo, nunca story/reels
// — ver criarPublicacaoManual) viram meta.slides, no formato que api/cron.js já publica desde
// antes desta rodada (o publicador nunca precisou de nenhuma mudança — só faltava a ponta da
// frente que grava meta.slides a partir de upload múltiplo, que não existia até agora).
let CRIAR_DIA=null;
function abrirCriacao(d){
  CRIAR_DIA=d;
  document.getElementById('criar-data-lbl').textContent=d+' de '+MESES[MES]+' de '+ANO;
  document.getElementById('criar-formato').value='feed';
  document.getElementById('criar-hora').value='09:00';
  document.getElementById('criar-tema').value='';
  document.getElementById('criar-copy').value='';
  const fi=document.getElementById('criar-arquivo'); if(fi)fi.value='';
  const btn=document.getElementById('criar-salvar'); if(btn){btn.disabled=false;btn.textContent='Criar publicação';}
  atualizarCampoCopyCriacao();
  document.getElementById('criar-modal').style.display='flex';
}
function fecharCriacao(){document.getElementById('criar-modal').style.display='none';CRIAR_DIA=null;}
// STORY NÃO TEM LEGENDA (item 3, 15/set/2026): esconde o campo de copy quando o formato é story
// — regra de plataforma (Stories do Instagram não têm legenda como feed/reels), não preferência.
function atualizarCampoCopyCriacao(){
  const formato=document.getElementById('criar-formato').value;
  const ehStory=(formato==='story');
  const wrap=document.getElementById('criar-copy-wrap'), aviso=document.getElementById('criar-copy-aviso-story');
  if(wrap)wrap.style.display=ehStory?'none':'';
  if(aviso)aviso.style.display=ehStory?'':'none';
  // CARROSSEL POR UPLOAD (25/set/2026, decisão 2, "STORY NÃO ACEITA CARROSSEL", autorizado pelo
  // João) — story aceita só um arquivo, mesma natureza da regra que já esconde a legenda acima.
  // REELS (extensão, não pedida explicitamente na ordem, mas decorre do mesmo mecanismo: um
  // conteúdo com formato='reels' é sempre tratado como VÍDEO ÚNICO pelo publicador — ver
  // `ehVideo` em api/cron.js, que casa a palavra "reel" no `formato` ANTES de olhar pra
  // meta.slides — então um carrossel gravado sob formato='reels' nunca seria publicado como tal,
  // silenciosamente: só a capa sairia, como um Reels comum, descartando os demais arquivos sem
  // aviso nenhum. Reportado no relatório desta entrega). `multiple` só fica disponível pra feed.
  const fi=document.getElementById('criar-arquivo'), lbl=document.getElementById('criar-arquivo-lbl');
  const sozinho=(ehStory||formato==='reels');
  if(fi){
    if(sozinho)fi.removeAttribute('multiple'); else fi.setAttribute('multiple','');
    // troca de formato para um que não aceita múltiplos, com múltiplos já escolhidos: limpa a
    // seleção — evita mandar 2+ arquivos escondidos por trás de um campo que parece aceitar 1.
    if(sozinho&&fi.files&&fi.files.length>1)fi.value='';
  }
  if(lbl)lbl.textContent=sozinho?'Arquivo (opcional agora — pode enviar depois em Aprovações)':'Arquivo (opcional agora — pode enviar depois em Aprovações). 2 a 10 imagens viram um carrossel.';
}
async function criarPublicacaoManual(){
  if(CRIAR_DIA==null||!CTX)return;
  const btn=document.getElementById('criar-salvar');
  const formato=document.getElementById('criar-formato').value||'feed';
  const ehStory=(formato==='story');
  const hora=document.getElementById('criar-hora').value||'09:00';
  const tema=document.getElementById('criar-tema').value.trim()||null;
  const copy=ehStory?'':(document.getElementById('criar-copy').value||'');
  const arquivos=Array.from(document.getElementById('criar-arquivo').files||[]);
  const dataISO=ANO+'-'+String(MES+1).padStart(2,'0')+'-'+String(CRIAR_DIA).padStart(2,'0');

  // CARROSSEL POR UPLOAD (25/set/2026, "Carrossel por upload no calendário, e alerta de defeito
  // com linguagem de produto", decisão 2, autorizado pelo João) — limites da meta, validados na
  // TELA, ANTES de subir qualquer coisa (nenhuma chamada de rede ainda neste ponto — nem o
  // insert do conteúdo, nem o upload). A tela recusa e explica em vez de deixar o publicador
  // (api/cron.js) descartar em silêncio: ele já corta em 10 (`slidesArr.slice(0,10)`) como última
  // defesa, mas a defesa aqui é a PRIMEIRA, pra o usuário saber por quê.
  if(arquivos.length>10){
    toast('Máximo de 10 arquivos por carrossel — você selecionou '+arquivos.length+'.','err');
    return;
  }
  if(arquivos.length>1&&ehStory){
    toast('Stories não aceitam carrossel — selecione só um arquivo.','err');
    return;
  }
  // REELS (extensão desta implementação, não nomeada na ordem — ver relatório desta entrega):
  // um conteúdo com formato='reels' é sempre tratado como vídeo único pelo publicador
  // (api/cron.js: `ehVideo` casa a palavra "reel" no campo `formato`, antes mesmo de olhar pra
  // meta.slides) — gravar um carrossel sob este formato nunca seria publicado como carrossel,
  // só a capa sairia como um Reels comum, descartando os demais arquivos sem aviso nenhum.
  if(arquivos.length>1&&formato==='reels'){
    toast('Reels não aceitam carrossel — selecione só um arquivo.','err');
    return;
  }
  if(arquivos.length>1&&arquivos.some(a=>String(a.type||'').indexOf('video')===0)){
    toast('Carrossel não aceita vídeo nesta entrega — todos os arquivos precisam ser imagem.','err');
    return;
  }

  btn.disabled=true;btn.textContent='Criando...';
  try{
    const uid=CTX.viewId||CTX.user.id;
    // Copy NÃO é obrigatória (confirmado em código: aprovar() nunca checa copy vazia antes de
    // aprovar — só bloqueia se o status ainda for aguardando_material). "avulso": mesmo motivo
    // de todo conteúdo fora do plano mensal — não concorre com a cota do plano, não entra na
    // agregação da Semana 1 (ver classificacao.js/agente-chat.js, Falha 3).
    const{data:ins,error}=await JUMP.sb.from('conteudos').insert({
      user_id:uid, tema:tema, copy:copy,
      formato:formato, status:JUMP_CLASS.STATUS_AGUARDANDO_MATERIAL,
      origem:'avulso', origem_agente:'usuario',
      data_sugerida:dataISO, data_agendada:dataISO+'T'+hora+':00',
      meta:{headline:tema||'', criado_manual:true}
    }).select().single();
    if(error)throw error;
    if(arquivos.length===1){
      // UM ARQUIVO: comportamento de hoje, intocado byte a byte (invariante da ordem) — mesmo
      // mecanismo de Storage que aprovar.html/enviarMaterial já usa, bucket 'user-uploads',
      // vínculo direto no midia_url deste conteúdo. Zero mudança no publicador.
      const arquivo=arquivos[0];
      btn.textContent='Enviando arquivo...';
      const path=uid+'/material_conteudo/'+ins.id+'-'+Date.now()+'-'+arquivo.name.replace(/[^a-zA-Z0-9.\-_]/g,'');
      const{error:errUp}=await JUMP.sb.storage.from('user-uploads').upload(path,arquivo);
      if(errUp)throw errUp;
      const{data:pub}=JUMP.sb.storage.from('user-uploads').getPublicUrl(path);
      const{error:errSet}=await JUMP.sb.from('conteudos').update({midia_url:pub.publicUrl,status:'aguardando_aprovacao'}).eq('id',ins.id);
      if(errSet)throw errSet;
      ins.midia_url=pub.publicUrl; ins.status='aguardando_aprovacao';
    }else if(arquivos.length>1){
      // CARROSSEL (2+ arquivos, decisão 1): mesmo bucket e caminho de hoje, um upload por
      // arquivo, na ORDEM em que o usuário escolheu — meta.slides no formato {n,url} que o
      // publicador já consome (api/cron.js, `slidesArr`). A capa continua em midia_url — é o
      // PRIMEIRO arquivo escolhido, nunca recalculada depois.
      btn.textContent='Enviando arquivos (0/'+arquivos.length+')...';
      const enviados=[]; // paths já subidos no Storage — limpos (melhor esforço) se algum falhar
      const slides=[];
      try{
        for(let i=0;i<arquivos.length;i++){
          const arquivo=arquivos[i];
          const path=uid+'/material_conteudo/'+ins.id+'-'+Date.now()+'-'+i+'-'+arquivo.name.replace(/[^a-zA-Z0-9.\-_]/g,'');
          const{error:errUp}=await JUMP.sb.storage.from('user-uploads').upload(path,arquivo);
          if(errUp)throw errUp;
          enviados.push(path);
          const{data:pub}=JUMP.sb.storage.from('user-uploads').getPublicUrl(path);
          slides.push({n:i+1,url:pub.publicUrl});
          btn.textContent='Enviando arquivos ('+(i+1)+'/'+arquivos.length+')...';
        }
      }catch(eUp){
        // OU SOBEM TODOS, OU NENHUM É GRAVADO (invariante da ordem) — até aqui nada foi escrito
        // em `conteudos` (só Storage); limpa os arquivos já enviados pra não deixar sobra órfã
        // no bucket, melhor esforço, nunca troca o erro real por um erro de limpeza.
        if(enviados.length){
          try{await JUMP.sb.storage.from('user-uploads').remove(enviados);}catch(eDel){console.error('[criar-publicacao] limpeza de upload parcial falhou:',eDel);}
        }
        throw eUp;
      }
      const metaFinal={...(ins.meta||{}),slides};
      const{error:errSet}=await JUMP.sb.from('conteudos').update({midia_url:slides[0].url,meta:metaFinal,status:'aguardando_aprovacao'}).eq('id',ins.id);
      if(errSet)throw errSet;
      ins.midia_url=slides[0].url; ins.meta=metaFinal; ins.status='aguardando_aprovacao';
    }
    EVENTOS.push(ins);
    toast(arquivos.length?'✓ Publicação criada e enviada para Aprovações!':'✓ Publicação criada — envie o arquivo em Aprovações quando estiver pronto.');
    fecharCriacao(); render(); if(DIA_SEL!=null)verDia(DIA_SEL);
  }catch(e){ toast(e.message||'Erro ao criar publicação','err'); btn.disabled=false; btn.textContent='Criar publicação'; }
}
// EXCLUIR NO CALENDÁRIO (Parte 2, 15/set/2026): mesmo descarte da Etapa 1 (status='excluido',
// soft-delete — nunca some do banco, só do que o cliente vê; calendario.html já filtrava
// 'excluido' desde a Etapa 1, ver EVENTOS acima). Só ficava faltando o botão AQUI — antes só
// dava pra excluir de dentro do modal de edição em aprovar.html.
async function excluirDoCalendario(id){
  if(!confirm('Excluir este post de vez? Esta ação não volta para o agente e não pode ser desfeita.'))return;
  try{
    await JUMP.sb.from('conteudos').update({status:'excluido'}).eq('id',id);
    EVENTOS=EVENTOS.filter(e=>String(e.id)!==String(id));
    toast('Post excluído.');
    render(); if(DIA_SEL!=null)verDia(DIA_SEL);
  }catch(e){ toast('Erro ao excluir','err'); }
}
